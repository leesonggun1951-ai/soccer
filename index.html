<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유소년축구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: game "garage" screen — sidebar menu | sunny pitch hero with morphing line-art player + stat bars | 4x2 skill card grid */
:root{
  --sky:#d9f0ff; --sky2:#f4fbff; --grass:#5cc45a; --grass-d:#2f9a43;
  --ink:#16336b; --ink-soft:#4b6390; --paper:#ffffff; --sun:#ffc93c; --orange:#ff8a3d;
  --glow:#3ddc6a; --lock:#aab6c8; --lock-bg:#eef2f7;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sky2);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}

/* sidebar */
.side{background:var(--paper);border-radius:20px;padding:16px 12px;box-shadow:0 6px 20px rgba(22,51,107,.08);align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;padding:0 6px 12px;border-bottom:2px dashed #e1ebf5;margin-bottom:10px}
.logo svg{width:34px;height:34px}
.grp{font-family:var(--display);font-size:13px;color:var(--ink-soft);letter-spacing:.06em;padding:10px 8px 4px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:12px;color:var(--ink);font-size:15px;text-align:left}
.nav button .dot{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#fff;flex:none}
.nav button:hover{background:var(--sky2)}
.nav button[aria-current="true"]{background:var(--glow);color:#fff;box-shadow:0 0 0 3px rgba(61,220,106,.25)}
.nav .soon{margin-left:auto;font-size:11px;color:var(--ink-soft)}
.nav button[aria-current="true"] .soon{color:#fff}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;min-height:330px;
  background:linear-gradient(180deg,var(--sky) 0%,#eef9ff 52%,var(--grass) 52%,var(--grass-d) 100%);
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:8px;padding:22px 24px;box-shadow:0 10px 30px rgba(22,51,107,.12)}
.hero::before{content:"";position:absolute;inset:52% 0 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 60px,transparent 60px 120px);pointer-events:none}
.sun{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff6c9 0,var(--sun) 55%,rgba(255,201,60,0) 72%)}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.9}
.streaks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.streaks i{position:absolute;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);transform:rotate(-18deg) translateX(-120%);opacity:0}
.zoom .streaks i{animation:zip .55s ease-out forwards}
@keyframes zip{0%{opacity:0;transform:rotate(-18deg) translateX(-120%)}30%{opacity:1}100%{opacity:0;transform:rotate(-18deg) translateX(260%)}}
.stage{position:relative;z-index:1;min-width:0}
.stage svg{width:100%;max-width:100%;height:auto;display:block}
.info{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
.tag{align-self:flex-start;font-family:var(--display);font-size:13px;background:var(--paper);color:var(--ink);padding:3px 12px;border-radius:99px}
.tag.lv2{background:var(--orange);color:#fff}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,50px);line-height:1.05;margin:0;color:var(--ink);text-shadow:0 3px 0 #fff;text-wrap:balance}
.desc{margin:0;font-size:16px;color:var(--ink);background:rgba(255,255,255,.82);padding:8px 12px;border-radius:12px}
.stats{display:grid;gap:7px;background:rgba(255,255,255,.85);padding:10px 12px;border-radius:14px}
.stat{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:8px;font-family:var(--display);font-size:13px;letter-spacing:.04em}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bar span{height:11px;border-radius:4px;background:#dfe7f1;transition:background .3s}
.bar span.on{background:var(--c)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-family:var(--display);font-size:17px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.go{background:var(--glow);color:#fff;box-shadow:0 4px 0 var(--grass-d)}
.btn.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grass-d)}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 #c9d6e6}
.btn.dad{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #d9a21c}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.vidnote{font-size:13px;color:var(--ink);background:rgba(255,255,255,.75);padding:6px 10px;border-radius:10px}

/* stamps */
.stamps{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:14px}
.stamps b{width:24px;height:24px;border-radius:50%;border:2.5px dashed var(--ink-soft);display:grid;place-items:center;background:#fff}
.stamps b.on{border:0;background:var(--orange);color:#fff;font-size:12px;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

/* dad check panel */
.dadbox{background:var(--paper);border-radius:16px;padding:12px;display:grid;gap:8px;box-shadow:0 6px 16px rgba(22,51,107,.15)}
.dadbox .row{display:flex;gap:8px;flex-wrap:wrap}
.dadbox input{font-size:20px;letter-spacing:.4em;width:140px;padding:8px 10px;border:2px solid #cfdbea;border-radius:10px;font-family:var(--display)}
.msg{font-size:14px;min-height:1.2em}
.msg.bad{color:#c43d2a}

/* cards */
.gridhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 4px 10px;flex-wrap:wrap}
.gridhead h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.gridhead p{margin:0;font-size:13px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{position:relative;border:0;background:var(--paper);border-radius:18px;padding:10px 10px 12px;display:grid;gap:6px;text-align:left;color:var(--ink);
  box-shadow:0 4px 0 #d6e2ef;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px)}
.card[aria-pressed="true"]{box-shadow:0 0 0 4px var(--glow),0 0 24px rgba(61,220,106,.55);transform:translateY(-4px) scale(1.02)}
.card svg{width:100%;height:auto;background:linear-gradient(180deg,#eef8ff 62%,#dff5df 62%);border-radius:12px}
.card .nm{font-family:var(--display);font-size:17px;line-height:1.15}
.card .sub{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft)}
.mini{display:flex;gap:3px}
.mini i{width:9px;height:9px;border-radius:50%;background:#dfe7f1}
.mini i.on{background:var(--orange)}
.card.locked{background:var(--lock-bg);box-shadow:0 4px 0 #d3dbe6}
.card.locked svg{filter:grayscale(1) opacity(.45)}
.card.locked .nm{color:#6d7d96}
.lockbadge{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:0 3px 0 #d9a21c}
.card.unlocking{animation:unlock .9s}
@keyframes unlock{0%{transform:scale(1)}20%{transform:scale(1.08) rotate(-3deg)}40%{transform:scale(1.08) rotate(3deg)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.trophy{color:var(--orange);font-family:var(--display)}

/* panels */
.panel{background:var(--paper);border-radius:22px;padding:22px clamp(16px,3vw,28px);box-shadow:0 8px 24px rgba(22,51,107,.08)}
.panel h1{font-size:clamp(28px,4vw,38px);text-shadow:none;margin-bottom:6px}
.panel .lead{color:var(--ink-soft);margin:0 0 16px;max-width:62ch}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.tip{background:var(--sky2);border-radius:16px;padding:14px;min-width:0}
.tip h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 4px}
.tip p{margin:0;font-size:14.5px}
.tip .game{margin-top:8px;font-size:13.5px;background:#fff;border-radius:10px;padding:6px 9px}
.tip .game b{font-family:var(--display);font-weight:400;color:var(--orange)}
.settings{margin-top:18px;border-top:2px dashed #e1ebf5;padding-top:14px;display:grid;gap:10px}
.settings label{font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;font-family:var(--display);font-size:18px;padding:12px 20px;border-radius:16px;transition:transform .35s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.sync{font-size:12px;color:var(--ink-soft);padding:10px 8px 0}


body{margin:0;-webkit-text-size-adjust:100%}
.app{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s,opacity .5s}
body.watching .app{transform:translateY(38vh) scale(.94);filter:saturate(.6) blur(1px);opacity:.55;pointer-events:none}
.pip{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(560px,calc(100vw - 32px));background:var(--ink);border-radius:18px;padding:8px;box-shadow:0 18px 50px rgba(22,51,107,.4);
  transform:translateY(130%) scale(.9);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
body.watching .pip{transform:none;opacity:1}
.pip .bar2{display:flex;align-items:center;gap:8px;color:#fff;padding:2px 4px 8px;font-family:var(--display);font-size:15px;cursor:default;user-select:none}
.pip .bar2 span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pip .bar2 button{border:0;border-radius:10px;padding:6px 10px;font-family:var(--display);font-size:14px;background:#fff;color:var(--ink)}
.pip .bar2 .x{background:var(--orange);color:#fff}
.pip .frame{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.pip iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pip .hint{color:#c9d6ee;font-size:12px;padding:6px 4px 0}
.pip.big{inset:0;width:auto;border-radius:0;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;background:#000}
.pip.big .frame{flex:1;aspect-ratio:auto}
.pip.big .hint{display:none}
.pip:fullscreen{width:100vw;border-radius:0;padding:0;display:flex;flex-direction:column;justify-content:center;background:#000}
.pip:fullscreen .frame{aspect-ratio:auto;flex:1;border-radius:0}
.pip:fullscreen .hint{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;padding:10px}
  .logo{border:0;margin:0;padding-bottom:6px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav button{white-space:nowrap;width:auto}
  .grp,.sync{display:none}
  .hero{grid-template-columns:minmax(0,1fr);padding:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- figure drawing ---------- */
function figSVG(p,opt={}){
  const [h,n,pl,le,lh,re,rh,lk,lf,rk,rf,b]=p;
  const L=(a,...pts)=>`<polyline points="${[a,...pts].map(q=>q.join(",")).join(" ")}"/>`;
  const sw=opt.sw||5;
  return `<g fill="none" stroke="${opt.color||"#16336b"}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">
    ${L(n,pl)}${L(n,le,lh)}${L(n,re,rh)}${L(pl,lk,lf)}${L(pl,rk,rf)}
    <circle cx="${h[0]}" cy="${h[1]}" r="13" fill="#fff"/>
  </g>
  <g transform="translate(${b[0]} ${b[1]})"><circle r="11" fill="#fff" stroke="#16336b" stroke-width="3"/><path d="M0 -5l5 3.5-2 6h-6l-2-6z" fill="#16336b"/></g>`;
}
function cardSVG(k){return `<svg viewBox="30 30 200 196" aria-hidden="true">${figSVG(POSES[k],{sw:6})}</svg>`}

let anim=null,shown=POSES.idle;
function tweenTo(k){
  const target=POSES[k],from=shown.map(q=>q.slice()),t0=performance.now(),D=520;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  cancelAnimationFrame(anim);
  const step=t=>{
    let x=Math.min(1,(t-t0)/D);if(reduce)x=1;
    const e=1+2.2*Math.pow(x-1,3)+1.2*Math.pow(x-1,2); // ease-out-back
    shown=from.map((q,i)=>[q[0]+(target[i][0]-q[0])*e,q[1]+(target[i][1]-q[1])*e]);
    const g=document.getElementById("fig");if(g)g.innerHTML=figSVG(shown,{sw:6});
    if(x<1)anim=requestAnimationFrame(step);else{shown=target.map(q=>q.slice());const tr=document.getElementById("trail");if(tr)tr.setAttribute("d",TRAIL[k]||"");}
  };
  const tr=document.getElementById("trail");if(tr)tr.setAttribute("d","");
  anim=requestAnimationFrame(step);
}

  ["2초에 한 번 고개 들기","드리블할 때도 공만 보지 말고 자주 앞을 봐요. 공은 발이 느끼고, 눈은 경기를 봐요.","<b>놀이</b> 드리블하는 동안 아빠가 든 손가락 개수 맞히기"],
  ["빈 공간 찾기","친구가 공을 가지면 수비수가 없는 곳으로 달려가요. 그래야 패스를 받을 수 있어요.","<b>놀이</b> 콘 4개 사이에서 아빠를 피해 빈 곳으로 이동하기"]]},
 muscle:{t:"근육 지도",lead:"축구를 하면 쓰는 근육이 정해져 있어요. 9살에는 무거운 운동보다 뛰고 차고 놀면서 몸을 쓰는 게 제일 좋아요.",tips:[
  ["차기 → 허벅지 앞","공을 찰 때 무릎을 쭉 펴는 허벅지 앞 근육이 일해요. 슛을 많이 차면 여기가 힘들어요.","<b>느껴 보기</b> 슛 10번 차고 허벅지 앞 만져 보기"],
  ["달리기 → 종아리·허벅지 뒤","빨리 달리고 멈출 때 종아리와 허벅지 뒤가 일해요.","<b>놀이</b> 아빠와 10m 달리기, 멈춤 신호에 딱 서기"],
  ["균형 → 배·엉덩이","한 발로 서서 공을 찰 때 몸이 흔들리지 않게 배와 엉덩이 근육이 잡아 줘요.","<b>놀이</b> 한 발로 서서 10까지 세기, 반대 발도"]]},
 massage:{t:"마사지",lead:"운동이 끝나면 몸을 달래 줘요. 아빠랑 같이 하면 더 좋아요. 아프면 바로 멈춰요.",tips:[
  ["종아리 쓸어 올리기","발목에서 무릎 쪽으로 손바닥으로 천천히 10번 쓸어 올려요.","<b>순서</b> 운동 끝 → 물 마시기 → 종아리 쓸기"],
  ["허벅지 톡톡","주먹을 살짝 쥐고 허벅지 앞과 옆을 가볍게 톡톡 두드려요. 세게 치지 않아요.","<b>숫자 놀이</b> 톡톡 20번 세면서 하기"],
  ["10초 스트레칭","다리를 앞으로 뻗고 발끝을 잡는 느낌으로 10초 버티기. 튕기지 말고 천천히.","<b>함께</b> 아빠가 10초 세어 주기"]]},
 gear:{t:"장비",lead:"좋은 장비는 다치지 않게 지켜 줘요. 하나씩 챙기는 법을 익혀요.",tips:[
  ["축구공 4호","8~12살은 4호 공이 맞아요. 5호는 어른 공이라 무겁고 커요.","<b>점검</b> 공을 눌렀을 때 살짝 들어가면 바람이 알맞아요"],
  ["정강이 보호대","양말 안에 넣고 정강이 뼈 한가운데에 오게 해요. 발목 쪽 끈이 있으면 아래로.","<b>순서</b> 보호대 → 양말 → 축구화"],
  ["축구화","운동장에 맞는 걸 신어요. 인조잔디나 풋살장은 짧은 돌기 축구화가 미끄럽지 않아요. 끈은 두 번 묶기!","<b>점검</b> 엄지발가락 앞에 손가락 반 마디 여유"],
  ["물병·모자·선크림","더운 날엔 15분마다 물 한 모금. 햇볕이 강하면 모자와 선크림.","<b>챙기기</b> 가방에 물병 넣었나 확인"]]}
};
function renderPanel(id){
  if(id==="players"){main.innerHTML=`<section class="panel"><h1>축구선수</h1><p class="lead">유명한 유소년 선수들의 스킬을 모아 이 칸에 넣을 예정이에요. 지금은 스킬 8칸부터 연습해요!</p></section>`;return}
  const p=PANELS[id];
  main.innerHTML=`<section class="panel"><h1>${p.t}</h1><p class="lead">${p.lead}</p>
   <div class="btns" style="margin:-4px 0 14px;align-items:center"><span style="font-size:13px;color:var(--ink-soft)">영상 언어</span><button class="btn ${state.lang!=="ko"?"go":"alt"} lg" data-l="vi" style="font-size:14px;padding:6px 12px">Tiếng Việt</button><button class="btn ${state.lang==="ko"?"go":"alt"} lg" data-l="ko" style="font-size:14px;padding:6px 12px">한국어</button></div>
   <div class="tips">${p.tips.map(([h,t,g],i)=>{const vs=tipVids(h),vi=(state.vidx[id+i]||0)%(vs.length||1);return `<div class="tip"><h3>${h}</h3><p>${t}</p><div class="game">${g}</div>
     ${vs.length?`<div class="btns" style="margin-top:10px"><button class="btn go tv" data-i="${i}" style="font-size:15px;padding:8px 12px">영상 보기 ▶</button>${vs.length>1?`<button class="btn alt tn" data-i="${i}" style="font-size:15px;padding:8px 12px">다른 영상</button>`:""}</div>
     <div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px">${vs[vi][1]} · ${vs[vi][2]} · ${vs[vi][3]}${state.lang!=="ko"&&!TIPV_VI[h]?" (한국어 영상)":""}</div>`:""}</div>`}).join("")}</div>
   ${id==="gear"?settingsHTML():""}</section>`;
  main.querySelectorAll(".tv").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,h=p.tips[i][0],vs=tipVids(h);openPip({nm:h},vs[(state.vidx[id+i]||0)%vs.length])});
  main.querySelectorAll(".tn").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.vidx[id+i]=(state.vidx[id+i]||0)+1;save();renderPanel(id)});
  main.querySelectorAll(".lg").forEach(b=>b.onclick=()=>{state.lang=b.dataset.l;state.vidx={...state.vidx};save();renderPanel(id)});
  if(id==="gear")bindSettings();
}
function settingsHTML(){return `<form class="settings" id="setform"><h3 style="font-family:var(--display);font-weight:400;margin:0">아빠 설정</h3>
  <label for="oldpin">지금 비밀번호 (처음은 1234)</label><input id="oldpin" type="password" inputmode="numeric" maxlength="4" style="width:140px;padding:8px;border:2px solid #cfdbea;border-radius:10px">
  <label for="newpin">새 비밀번호 4자리</label><input id="newpin" type="password" inputmode="numeric" maxlength="4" style="width:140px;padding:8px;border:2px solid #cfdbea;border-radius:10px">
  <div class="btns"><button class="btn dad" type="submit">비밀번호 바꾸기</button><button class="btn alt" type="button" id="resetbtn">도장 모두 지우기</button></div>
  <div class="msg" id="setmsg"></div></form>`}
function bindSettings(){
  const m=()=>document.getElementById("setmsg");
  document.getElementById("setform").onsubmit=e=>{e.preventDefault();
    if(document.getElementById("oldpin").value!==state.pin){m().textContent="지금 비밀번호가 달라요.";m().className="msg bad";return}
    const np=document.getElementById("newpin").value;if(!/^\d{4}$/.test(np)){m().textContent="숫자 4자리로 넣어 주세요.";m().className="msg bad";return}
    state.pin=np;save();m().textContent="비밀번호를 바꿨어요.";m().className="msg"};
  document.getElementById("resetbtn").onclick=()=>{
    if(document.getElementById("oldpin").value!==state.pin){m().textContent="도장을 지우려면 위에 지금 비밀번호를 먼저 넣어 주세요.";m().className="msg bad";return}
    state.stamps={};save();m().textContent="도장을 모두 지웠어요.";m().className="msg"};
}

/* ---------- PIP player ---------- */
const pip=document.getElementById("pip");let pipSkill=null;
function openPip(s,v){
  pipSkill=s;
  document.getElementById("piptitle").textContent=s.nm+" · "+v[1];
  document.getElementById("pipframe").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${v[0]}?autoplay=1&rel=0&playsinline=1&modestbranding=1" title="${v[1]}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  document.body.classList.add("watching");pip.setAttribute("aria-hidden","false");
}
function closePip(){
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  setBig(false);
  document.body.classList.remove("watching");pip.setAttribute("aria-hidden","true");
  setTimeout(()=>{document.getElementById("pipframe").innerHTML=""},300);
  if(pipSkill&&pipSkill.k&&stamps(pipSkill.k)<5)setTimeout(()=>toast("따라 해 봤어? 아빠한테 보여 줘!"),500);
}
function setBig(on){pip.classList.toggle("big",on);document.getElementById("pipfs").textContent=on?"작게 보기":"전체화면"}
function fsPip(){
  if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});setBig(false);return}
  if(pip.classList.contains("big")){setBig(false);return}
  setBig(true);
  try{const r=pip.requestFullscreen&&pip.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}
}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&pip.classList.contains("big")&&document.body.classList.contains("watching")){/* keep big mode until user shrinks */}});
document.getElementById("pipx").onclick=closePip;
document.getElementById("pipfs").onclick=fsPip;
document.getElementById("pipbar").ondblclick=fsPip;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.fullscreenElement&&document.body.classList.contains("watching"))closePip()});

/* ---------- render & boot ---------- */
const main=document.getElementById("main");
function render(){renderNav();if(view==="skills"){renderSkills();tweenTo(cur)}else renderPanel(view)}
render();
setSync("이 기기에 기록이 저장돼요");
</script>
</body>
